[package]
name = "oxidegate"
version = "0.13.0"
edition = "2024"
# `edition = "2024"` requires Rust 1.85. Declaring it explicitly turns a cryptic
# compile error on older toolchains into a clear "update your Rust" message.
rust-version = "1.85"
license = "MIT"
description = "Local proxy that measures cost, tokens and latency of every LLM request across Anthropic, OpenAI and Gemini — and optimizes the traffic without breaking transparency."
repository = "https://github.com/pichu2707/OxideGate"
homepage = "https://github.com/pichu2707/OxideGate"
# Binary-only crate: docs.rs has no public API to render, so point readers at
# the repository instead of an empty documentation build.
documentation = "https://github.com/pichu2707/OxideGate"
readme = "README.md"
keywords = ["llm", "proxy", "telemetry", "observability", "tokens"]
categories = [
    "command-line-utilities",
    "development-tools",
    "web-programming::http-server",
    "network-programming",
]
# Internal agent/spec tooling is useless to anyone installing the binary.
exclude = [
    "openspec/",
    ".claude/",
    ".atl/",
    "presentations/",
    ".env",
]

# Los binarios se declaran a mano: la autodetección de Cargo los llamaría
# `monitor`, nombre demasiado genérico para instalarse en el PATH del usuario
# (`cargo install`, formula de Homebrew). El prefijo `oxidegate-` lo mantiene
# inconfundible.
#
# Aquí SOLO va lo que debe acabar en el PATH de alguien. `bench` es una barrida
# de desarrollo y vive en `examples/`: Cargo no instala examples, así que la
# garantía —que bench no se instale— la sostiene la estructura del proyecto y
# no la documentación. Antes dependía de que la fórmula de Homebrew filtrara a
# mano, y `cargo install` no filtra nada: en 0.5.0 instalaba los tres.
#
# NO HAY BLOQUE `[[example]]` CON `required-features`, Y ES DELIBERADO (#52).
#
# Cargo compila los examples durante `cargo test`, así que un error en
# `examples/bench.rs` rompe la suite entera aunque el PR no lo toque. La
# tentación es excluirlo:
#
#     [features]
#     bench = []
#     [[example]]
#     name = "bench"
#     required-features = ["bench"]
#
# Funciona —está probado— y hace exactamente lo contrario de lo que hace falta:
# este repo NO TIENE CI que compile nada (el único check de los PR es escaneo
# de secretos). `cargo test` es lo ÚNICO que mantiene vivo el bench. Excluirlo
# no le quitaría el ruido a alguien: garantizaría que se pudra sin que nadie
# se entere, que es el fallo silencioso que este proyecto persigue en todas
# partes.
#
# Si algún día el ruido molesta de verdad, la salida es añadir CI que compile
# el bench en un job aparte —no quitarlo de la suite mientras no haya nada que
# lo sustituya. Ver `docs/benchmark.md`.
[[bin]]
name = "oxidegate"
path = "src/main.rs"

[[bin]]
name = "oxidegate-monitor"
path = "src/bin/monitor.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
reqwest = { version = "0.12", features = ["stream", "json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
bytes = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
ratatui = "0.29"
crossterm = "0.28"
zstd = "0.13"
flate2 = "1"
